<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Unidade de Medida</title>
    <link rel="stylesheet" href="forma_pagamento.css">
</head>

<body onload="listar()">
    <header>
        <h1>Cadastro de Formas de Pagamento</h1>
        <p>Gerencie as formas de pagamento do sistema.</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados da Unidade de Medida</h2>
                
                <label for="inputId_forma_pagamento">ID da forma de pagamento</label>
                <div class="linha-id">
                    <input type="text" name="inputId_forma_pagamento" id="inputId_forma_pagamento" placeholder="Ex: 23" >
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_forma_pagamento">Nome da Forma de Pagamento</label>
                <input type="text" name="inputNome_forma_pagamento" id="inputNome_forma_pagamento" placeholder="Ex: Cartão">

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>
        </div>

        <section class="lista-pagamentos">
            <h3>Formas de Pagamento Cadastradas</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema CRUD Formas de Pagamento. Todos os direitos reservados.</p>
    </footer>

    <script src="./forma_pagamento.js"></script>
</body>

</html>
