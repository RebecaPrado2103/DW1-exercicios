<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Pessoa</title>
    <link rel="stylesheet" href="Pessoa.css">
</head>

<body onload="listar()">
    <!-- Cabeçalho Semântico -->
    <header>
        <h1>Cadastro de Pessoa</h1>
        <p>Faça seu cadastro de forma fácil e rápida.</p>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container-master">
        
        <div class="conteudo-principal">
            <!-- Seção do Formulário -->
            <section class="form-esquerda">
                <h2>Dados do Filme</h2>
                
                <label for="inputId_pessoa">ID da Pessoa</label>
                <div class="linha-id">
                    <input type="text" name="inputId_pessoa" id="inputId_pessoa" placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_pessoa">Nome da Pessoa</label>
                <input type="text" name="inputNome_pessoa" id="inputNome_pessoa">

                <label for="inputData_nascimento">Data de Nascimento</label>
                <input type="date" name="inputData_nascimento" id="inputData_nascimento">

                <label for="inputNomeMae">Nome da Mãe da Pessoa</label>
                <input type="text" name="inputNomeMae" id="inputNomeMae">

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>

            <!-- Aside para a Imagem (Conteúdo Lateral) -->
            <aside class="form-direita">
                <h2>Foto da Pessoa</h2>
                <p class="instrucao-imagem">(Clique na imagem para alterar)</p>
                <div class="img-container">
                    <img id="imgFoto" src="http://localhost:3001/imagens/silhueta.png" alt="Foto da Pessoa" onclick="acionarUpload()">
                    <input type="file" id="inputImagem" accept="image/*" style="display: none;" onchange="previewImagem()">
                </div>
            </aside>
        </div>

        <!-- Seção da Listagem -->
        <section class="lista-pessoas">
            <h3>Pessoas Cadastradas</h3>
            <div id="outputSaida">Carregando...</div>
        </section>

    </main>

    <!-- Rodapé Semântico -->
    <footer>
        <p>&copy; 2026 Sistema CRUD Pessoa. Todos os direitos reservados.</p>
    </footer>

    <script src="./PessoaControle.js"></script>
</body>

</html>
